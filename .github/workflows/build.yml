name: Build Patched Kext
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Kext with Make
        run: |
          make -j4
          ls -la

      - name: Upload Compiled Kext
        uses: actions/upload-artifact@v4
        with:
          name: AirPort_RTW88-Patched
          path: |
            *.kext
            build/*.kext
