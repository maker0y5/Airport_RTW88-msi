name: Build Patched AirPort_RTW88
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout patched repository
        uses: actions/checkout@v4

      - name: Checkout Linux v6.12 rtw88 driver
        uses: actions/checkout@v4
        with:
          repository: torvalds/linux
          ref: v6.12
          sparse-checkout: drivers/net/wireless/realtek/rtw88
          sparse-checkout-cone-mode: false
          path: ../rtw88-stable

      - name: Fix fallthrough macro
        run: sed -i '' 's|#define fallthrough __attribute__((__fallthrough__))|#include <os/base.h>|g' src/compat/rtw88_compat.h

      - name: Build AirPort_RTW88.kext
        run: make airport -j4

      - name: Upload Compiled Kext
        uses: actions/upload-artifact@v4
        with:
          name: AirPort_RTW88-Patched
          path: build/out/AirPort_RTW88.kext
